<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गणेश दुध - डेअरी मॅनेजमेंट</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f0f9ff;
            --card: #ffffff;
            --text: #0f172a;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.3px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            padding-bottom: 82px;
            font-size: 16.5px;
        }

        /* वेलकम स्क्रीन */
        #welcome-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #0369a1 0%, #0284c7 55%, #15803d 100%);
            color: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #welcome-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .welcome-badge {
            background: rgba(255, 255, 255, 0.18);
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }
        .owner-title {
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fef08a;
            text-shadow: 0 3px 12px rgba(0,0,0,0.35);
            margin-bottom: 4px;
        }
        .dairy-sub {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .pasture-stage {
            width: 100%;
            max-width: 350px;
            height: 110px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            border-bottom: 6px solid #4ade80;
            margin-bottom: 22px;
        }
        .walking-herd {
            position: absolute;
            bottom: 4px;
            display: flex;
            align-items: flex-end;
            gap: 24px;
            white-space: nowrap;
            animation: walkAcross 6.5s linear infinite;
        }
        .animal-unit {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            animation: stepBounce 0.55s ease-in-out infinite alternate;
        }
        .animal-unit.buffalo { animation-delay: 0.25s; }
        .animal-icon { font-size: 3rem; line-height: 1; transform: scaleX(-1); }
        .animal-tag {
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(0,0,0,0.35);
            padding: 1px 8px;
            border-radius: 8px;
            margin-top: 2px;
        }
        @keyframes walkAcross {
            0% { transform: translateX(-180px); }
            100% { transform: translateX(370px); }
        }
        @keyframes stepBounce {
            0% { transform: translateY(0px) rotate(-2deg); }
            100% { transform: translateY(-6px) rotate(2deg); }
        }
        .enter-btn {
            background: #facc15;
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 11px 32px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            width: auto;
            margin-top: 0;
        }

        /* मुख्य हेडर */
        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 11px 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.16);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-wrap {
            max-width: 600px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-box { display: flex; align-items: center; gap: 10px; }
        .cattle-logo {
            background: #ffffff;
            border-radius: 12px;
            padding: 4px 7px;
            display: flex;
            align-items: center;
            gap: 2px;
            border: 2px solid #fde047;
        }
        .cattle-logo span { font-size: 1.4rem; line-height: 1; }
        header h1 { font-size: 1.65rem; font-weight: 700; line-height: 1.05; }
        header p { font-size: 0.88rem; font-weight: 600; color: #e0f2fe; }

        .container { padding: 12px; max-width: 600px; margin: auto; }
        .card {
            background: var(--card); border-radius: 14px; padding: 15px;
            margin-bottom: 13px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
            border-bottom: 1.5px solid #e2e8f0;
            padding-bottom
